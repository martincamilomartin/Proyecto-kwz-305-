<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawasaki LTD 305: manual técnico de taller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>:root{--bg:#e8eff6;--grid:rgba(11,92,173,.08);--sf:#fff;--sf2:#f2f6fb;--tx:#0e2238;--mu:#4f647b;--ac:#0b5cad;--oc:#fff;--ac2:#c8421a;--bd:#b7c8da;--hero:#0b3a6e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a2e;--grid:rgba(120,180,255,.07);--sf:#10263f;--sf2:#0d2036;--tx:#e4eefb;--mu:#93abc8;--ac:#6db3ff;--oc:#06223f;--ac2:#ff9466;--bd:#25446a;--hero:#0f3a68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1a2e;--grid:rgba(120,180,255,.07);--sf:#10263f;--sf2:#0d2036;--tx:#e4eefb;--mu:#93abc8;--ac:#6db3ff;--oc:#06223f;--ac2:#ff9466;--bd:#25446a;--hero:#0f3a68;color-scheme:dark}
html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--tx);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:960px;margin:0 auto;padding:14px 16px 30px}
h1,h2,.brand b{font-family:"Saira Condensed",Impact,sans-serif}
h1{font-size:clamp(2.6rem,8vw,4rem);margin:0;line-height:1;color:#fff}
h2{font-size:2.3rem;margin:0;line-height:1.1}
h2::after{content:"";display:block;width:120px;height:9px;margin:6px 0 10px;border-left:2px solid var(--ac);border-right:2px solid var(--ac);background:linear-gradient(var(--ac),var(--ac)) center/100% 1px no-repeat}
h3{margin:18px 0 6px;color:var(--ac);font-size:1.05rem}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:1.4rem;display:block;line-height:1.1}.brand small{color:var(--mu)}
.logo{background:var(--ac);color:var(--oc);font:700 1.2rem "Saira Condensed",sans-serif;padding:8px 10px;border-radius:4px}
.tools{display:flex;gap:8px;flex:1;max-width:460px;min-width:240px}
.tools input{flex:1;font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:4px;background:var(--sf);color:var(--tx)}
.mini,.tools button{font:600 .9rem "Source Sans 3",sans-serif;padding:8px 12px;border:1px solid var(--ac);border-radius:4px;background:var(--sf);color:var(--ac);cursor:pointer}
.prog{flex-basis:100%;font-size:.88rem;color:var(--mu)}.prog i{display:block;height:6px;background:var(--bd);border-radius:3px;margin-top:4px;overflow:hidden}.prog b{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--bd);margin-bottom:18px}
aside a{white-space:nowrap;padding:6px 13px;border:1px solid var(--bd);border-radius:4px;background:var(--sf);color:var(--tx);text-decoration:none;font-weight:600;font-size:.92rem}
aside a[aria-current="page"]{background:var(--ac);color:var(--oc);border-color:var(--ac)}aside a[data-d="1"]::after{content:" ✓"}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.sr{background:var(--sf);border:1px solid var(--ac);border-radius:4px;margin-bottom:14px;padding:6px}.sr[hidden]{display:none}.sr p{margin:8px}
.sr button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;padding:9px 10px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer}.sr span{color:var(--mu);font-size:.88rem}
section{display:none}section.on{display:block}.sub{color:var(--mu);margin:0 0 12px}
.hero{background:var(--hero);color:#cfe0f5;border-radius:6px;padding:24px;display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-bottom:26px}
.hero .sub{color:#cfe0f5}.hero img{width:100%;border:3px solid #fff;border-radius:4px;display:block}
.stats{display:flex;flex-wrap:wrap;margin:16px 0}.stats div{padding:2px 16px 2px 12px;border-left:3px solid #ff9466;margin:6px 0}
.stats b{font:700 1.7rem "Saira Condensed",sans-serif;color:#fff}.stats span{display:block;font-size:.85rem}.cred{font-size:.92rem}.cred b{color:#fff}
.btns{display:flex;gap:8px;margin:6px 0 14px}.btns button{font:600 .85rem "Source Sans 3",sans-serif;background:var(--sf);color:var(--ac);border:1px solid var(--ac);border-radius:4px;padding:5px 12px;cursor:pointer}
details{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:4px;margin:10px 0;padding:0 16px}
details[open]{border-left-color:var(--ac)}summary{cursor:pointer;padding:13px 0;font-weight:600}details>div{padding:0 0 14px}
details p{margin:0 0 8px}details ul,details ol{margin:0 0 10px;padding-left:22px}details li{margin:3px 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:.88rem}.sc{overflow-x:auto}
.cf{color:var(--ac2);font-style:normal;font-size:.92rem;font-weight:600}
.note,.out{border-left:4px solid var(--ac2);background:var(--sf2);padding:9px 14px;margin:10px 0;color:var(--mu);font-size:.95rem}.out{color:var(--tx)}.out:empty{display:none}
.odo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 12px}.odo input{font:700 2.2rem "Saira Condensed",sans-serif;width:8ch;text-align:right;padding:2px 10px;border:2px solid var(--ac);border-radius:4px;background:var(--bg);color:var(--tx)}
.tag{padding:1px 9px;border-radius:3px;font-size:.84rem;font-weight:600;border:1px solid var(--ac);color:var(--ac)}.tag.s{border-color:var(--ac2);color:var(--ac2)}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.vids a{display:block;background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:14px;color:var(--tx);text-decoration:none;font-weight:600}.vids a:hover{border-color:var(--ac)}.vids span{display:block;color:var(--mu);font-weight:400;font-size:.88rem}
a.l{color:var(--ac)}.ck{cursor:pointer}.ck input{width:18px;height:18px;vertical-align:-3px;accent-color:var(--ac)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.opt{font:inherit;padding:8px 14px;border:1px solid var(--bd);border-radius:4px;background:var(--sf2);color:var(--tx);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--oc);border-color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{border-color:#1f8f4f;background:rgba(31,143,79,.18)}.opt.bad{border-color:var(--ac2);background:rgba(200,66,26,.16)}.fb{color:var(--mu);margin:4px 0 14px}
select{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:4px;background:var(--sf);color:var(--tx)}
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}.pager a,.pager button{font:600 .95rem "Source Sans 3",sans-serif;padding:9px 14px;border:1px solid var(--ac);border-radius:4px;background:var(--sf);color:var(--ac);text-decoration:none;cursor:pointer}
.pager button[aria-pressed="true"]{background:var(--ac);color:var(--oc)}
footer{color:var(--mu);font-size:.85rem;margin:26px 0 8px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</div>

["Moto (Kawasaki LTD 305)",'<p>La LTD 305 (KZ305-B1, 1982) es una moto de estilo custom de la serie KZ305 de Kawasaki. Monta un motor bicilíndrico paralelo de cuatro tiempos, refrigerado por aire, con caja de seis velocidades y transmisión final por correa dentada reforzada con kevlar, en lugar de cadena.</p><p>Su mecánica sencilla y su correa de transmisión la hacen una buena moto de estudio para mantenimiento, ajuste de carburadores y diagnóstico eléctrico.</p>'],

{id:"mantenimiento",t:"Mantenimiento periódico",sub:"Calculadora de servicios por kilometraje",items:[
["Próximos servicios",'<div class="odo"><label for="km"><b>Kilometraje actual</b></label><input id="km" type="text" inputmode="numeric" maxlength="6" value="0"><span style="color:var(--mu)">km</span></div><div class="sc"><table><thead><tr><th>Tarea</th><th>Cada</th><th>Próxima</th><th>Estado</th></tr></thead><tbody id="mr"></tbody></table></div><div class="note">Intervalos orientativos. En ciudad, con trancones o calor, adelanta los servicios.</div>'],
["Revisión antes de cada salida",ul(["Nivel de aceite del motor","Presión y estado de las llantas","Frenos delantero y trasero","Luces, pito e indicadores","Estado y tensión visual de la correa","Fugas de aceite o gasolina"])],
["Consejos de mantenimiento",ul(["Cambia el aceite siempre con el filtro nuevo y registra el kilometraje.","Cambia el líquido de frenos al menos cada dos años.","Revisa la batería: bornes limpios y carga completa.","Guarda la moto con el tanque lleno y la batería cargada si va a quedar parada."])]
]},
{id:"ajustes",t:"Ajustes del motor",sub:"Válvulas, platinos, embrague y ralentí",items:[
["Holgura de válvulas",'<p>Se mide con el motor <b>frío</b>, con el pistón en el punto muerto superior de compresión de cada cilindro.</p>'+ol(["Retira el tanque si estorba y las tapas de válvulas.","Gira el motor hasta el punto muerto superior del cilindro a revisar.","Mide con galgas de láminas entre la leva y el balancín.","Ajusta si está fuera de rango y vuelve a medir tras apretar la contratuerca."])+'<p>Valor de holgura: '+CF+'</p>'],
["Platinos y puesta a punto",'<p>La KZ305 de 1982 usa encendido por platinos. Un platino quemado o mal calibrado causa fallas de arranque y pérdida de potencia.</p>'+ol(["Limpia los contactos y revisa que no tengan picaduras.","Gira el motor hasta que el platino abra al máximo y mide la separación.","Verifica el avance con las marcas de encendido y una lámpara estroboscópica."])+'<p>Separación y marcas: '+CF+'</p>'],
["Embrague",'<p>Revisa el juego libre en la palanca. Si está muy tenso patina; si está flojo no desconecta bien y dificulta cambiar de marcha. Ajusta con el regulador del cable.</p><p>Juego libre: '+CF+'</p>'],
["Cable del acelerador y ralentí",'<p>El puño debe tener un pequeño juego libre antes de mover los carburadores y volver solo a su posición. Ajusta el ralentí con el motor caliente, con el tornillo de tope del acelerador, hasta un régimen estable.</p><p>Régimen de ralentí: '+CF+'</p>']
]},
{id:"mezcla",t:"Mezcla aire-gasolina",sub:"Cómo leer y corregir la mezcla",items:[
["Conceptos básicos",'<p>La mezcla ideal ronda <b>14,7 partes de aire por 1 de gasolina</b>. Con más gasolina es <b>rica</b>; con más aire es <b>pobre</b>.</p>'+tb(["Mezcla","Señales"],[["Rica","Humo negro, olor a gasolina, bujías negras y hollín en el escape"],["Pobre","Motor caliente, petardeo en la admisión, bujías muy claras y pérdida de potencia"]])],
["Lectura de bujías",'<p>Con la moto ya caliente, un color <b>marrón claro</b> en el aislante indica mezcla correcta. Negro y seco señala exceso de gasolina; blanco señala mezcla pobre o calor excesivo.</p>'],
["Efecto de la altura en Bogotá",'<p>A 2.600 m el aire es menos denso que a nivel del mar, así que la misma carburación entrega una mezcla más rica y la moto pierde potencia. Puede requerir chicleres más pequeños o ajustar el tornillo de mezcla. Pruébalo siempre con lectura de bujía.</p>'],
["Causas frecuentes de mezcla incorrecta",ul(["Filtro de aire sucio (mezcla rica)","Entradas de aire por mangueras o juntas agrietadas (mezcla pobre)","Chicleres obstruidos o aguja desgastada","Nivel de flotador mal ajustado"])]
]},
{id:"calibracion",t:"Calibración del carburador",sub:"Limpieza, flotador y sincronización",items:[
["Limpieza",ol(["Retira los carburadores y drena la cámara del flotador.","Desarma chicleres, aguja y tornillo de mezcla anotando sus posiciones.","Limpia con limpiador de carburador y aire comprimido; nunca uses alambre en los orificios calibrados.","Revisa los diafragmas: no deben tener grietas ni perforaciones."])],
["Nivel del flotador",'<p>Con el carburador invertido, mide la altura del flotador respecto a la junta y corrige doblando con cuidado la lengüeta de la válvula de aguja.</p><p>Altura: '+CF+'</p>'],
["Tornillo de mezcla del ralentí",'<p>Se atornilla suavemente hasta el fondo, se cuenta las vueltas y se abre hasta la posición base. Luego se afina con el motor caliente, buscando el régimen más alto y estable.</p><p>Vueltas base: '+CF+'</p>'],
["Sincronización de los dos carburadores",ol(["Con el motor caliente, conecta un vacuómetro doble a cada cilindro.","Lleva el motor al ralentí.","Ajusta el tornillo de sincronización hasta igualar las lecturas.","Acelera ligeramente varias veces y verifica que se mantengan iguales."])]
]},
{id:"correa",t:"Correa, chasis y frenos",sub:"Transmisión por correa, dirección, suspensión y frenado",items:[
["Correa de transmisión (kevlar)",'<p>La correa reemplaza a la cadena y no necesita lubricación. Se revisa así:</p>'+ul(["Dientes sin grietas, cortes ni desgaste","Sin contacto con aceite o grasa","Sin objetos incrustados ni borde deshilachado","Tensión y alineación según el manual","No la dobles bruscamente ni la fuerces con herramientas"])+'<p>Tensión (flecha): '+CF+'</p>'],
["Chasis y dirección",ul(["Gira el manubrio de tope a tope: debe moverse suave, sin puntos duros ni juego.","Revisa tornillos del bastidor y soportes.","Busca grietas o soldaduras dañadas."])],
["Suspensión",ul(["Horquilla: sin fugas por los retenes y con movimiento suave.","Amortiguadores traseros: sin fugas y con la misma regulación a ambos lados.","Cambia el aceite de la horquilla según el intervalo."])],
["Frenos",tb(["Sistema","Qué revisar"],[["Disco delantero","Espesor, alabeo, estado de las pastillas y nivel de líquido"],["Tambor trasero","Desgaste de las zapatas y recorrido del pedal"]])+'<p style="margin-top:10px">Un freno esponjoso indica aire o líquido viejo: purga el sistema. Después de cualquier trabajo, prueba los frenos a baja velocidad.</p>'],
["Llantas",ul(["Revisa la presión en frío y el desgaste de la banda.","Busca cortes, abultamientos o grietas por edad."])+'<p>Presión recomendada: '+CF+'</p>']
]},
{id:"pares",t:"Pares de apriete",sub:"Valores generales de referencia",items:[
["Tabla general por diámetro de rosca",tb(["Diámetro","Par aproximado (N·m)"],[["5 mm","3,4 – 4,9"],["6 mm","5,9 – 7,8"],["8 mm","14 – 19"],["10 mm","25 – 34"],["12 mm","44 – 61"]])+'<div class="note">Son valores generales típicos de Kawasaki para tornillería métrica de esa época. Los pares específicos (culata, bujías, tapa de válvulas, eje de rueda, polea de la correa) están en el manual de servicio oficial.</div>'],
["Buenas prácticas",ul(["Usa torquímetro y aprieta en cruz o en espiral desde el centro.","Limpia las roscas y no lubriques salvo que el manual lo indique.","Aprieta en dos o tres pasadas progresivas.","Nunca reutilices tornillos estirados o con rosca dañada."])]
]},
{id:"electrico",t:"Sistema eléctrico",sub:"Batería, carga, encendido y luces",items:[

["Encendido",'<p>El encendido es por platinos, condensador y bobinas. Si no hay chispa, revisa en este orden: bornes de batería, interruptor de parada, platinos, condensador y bobina.</p>'],

function calc(){
  var km=parseInt($("km").value.replace(/\D/g,""),10)||0;
  $("mr").innerHTML=TASKS.map(function(t){var n=Math.floor(km/t[1])*t[1]+t[1],l=n-km,s=l<=Math.max(300,t[1]*0.1);
    return '<tr><td><b>'+t[0]+'</b></td><td>'+t[1].toLocaleString("es-CO")+' km</td><td>'+n.toLocaleString("es-CO")+' km</td><td><span class="tag'+(s?' s':'')+'">'+(s?'Pronto, faltan ':'Faltan ')+l.toLocaleString("es-CO")+' km</span></td></tr>'}).join('');
}
$("km").oninput=function(){this.value=this.value.replace(/\D/g,"");calc()};

var QZ=[["¿Qué transmisión final usa la LTD 305?",["Cadena","Correa dentada con kevlar","Cardán"],1,"Usa correa dentada reforzada con kevlar, que no necesita lubricación."],["¿Cuántas velocidades tiene su caja?",["5","4","6"],2,"Tiene caja de seis velocidades."],["¿Con qué estado del motor se mide la holgura de válvulas?",["Con el motor frío","Con el motor caliente","Da igual"],0,"Se mide con el motor frío."],["¿Cuál es la mezcla ideal aire-gasolina?",["Unas 8 partes de aire por 1 de gasolina","Unas 14,7 partes de aire por 1 de gasolina","Unas 25 partes de aire por 1 de gasolina"],1,"La mezcla ideal ronda 14,7 a 1."],["¿Por qué en Bogotá la mezcla tiende a ser más rica?",["Porque hace más frío","Porque el aire es menos denso por la altura","Porque la gasolina es distinta"],1,"A 2.600 m hay menos aire, así que la misma carburación queda más rica."],["¿Qué indica una bujía de color blanco?",["Mezcla correcta","Exceso de gasolina","Mezcla pobre o calor excesivo"],2,"El blanco señala mezcla pobre o calor excesivo."]];
function drawQ(){QA={};$("qz").innerHTML=QZ.map(function(q,i){return '<div><p><b>'+(i+1)+'. '+q[0]+'</b></p>'+q[1].map(function(o,j){return '<button class="opt" data-q="'+i+'" data-o="'+j+'">'+o+'</button>'}).join('')+'<p class="fb" id="fb'+i+'" aria-live="polite"></p></div>'}).join('')+'<div class="out" id="qs" aria-live="polite"></div><button class="mini" data-qr="1">Reiniciar</button>'}
function score(){var k=Object.keys(QA),a=k.filter(function(x){return QA[x]}).length;$("qs").textContent="Aciertos: "+a+" de "+QZ.length+(k.length===QZ.length?(a===QZ.length?". Excelente, dominas el manual.":". Repasa las secciones donde fallaste."):"")}
function upd(){var c=S.filter(function(s){return DONE[s.id]}).length;$("pt").textContent=c+" de "+S.length+" secciones estudiadas";$("pb").style.width=(c/S.length*100)+"%";document.querySelectorAll("#nav a").forEach(function(a){a.dataset.d=DONE[a.dataset.s]?"1":"0"});document.querySelectorAll("[data-done]").forEach(function(b){var d=DONE[b.dataset.done];b.textContent=d?"✓ Estudiada":"Marcar como estudiada";b.setAttribute("aria-pressed",d?"true":"false")})}
function ath(){var r=document.documentElement;if(TH==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",TH);$("th").textContent="Tema: "+{auto:"auto",light:"claro",dark:"oscuro"}[TH]}
function go(id,i){history.replaceState(null,"","#"+id);show(id);var d=document.querySelectorAll("#"+id+" details")[i||0];if(d){d.open=true;d.scrollIntoView({block:"start"})}}
var f=function(x){return x.toFixed(1).replace(".",",")};
$("th").onclick=function(){TH={auto:"light",light:"dark",dark:"auto"}[TH];LS.set("ltd-th",TH);ath()};
$("gs").oninput=function(){var v=this.value.trim().toLowerCase(),r=$("sr");if(v.length<2){r.hidden=true;return}var h=[];S.forEach(function(s){s.items.forEach(function(it,i){var t=(it[0]+" "+it[1].replace(/<[^>]+>/g," ")).toLowerCase();if(t.indexOf(v)>-1&&h.length<8)h.push('<button data-go="'+s.id+'" data-i="'+i+'"><b>'+it[0]+'</b><span>'+s.t+'</span></button>')})});r.innerHTML=h.length?h.join(''):'<p>Sin resultados. Prueba con otra palabra, por ejemplo “válvulas” o “correa”.</p>';r.hidden=false};
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.go){go(t.dataset.go,+t.dataset.i);$("sr").hidden=true;$("gs").value="";return}
if(t.dataset.done){DONE[t.dataset.done]=!DONE[t.dataset.done];LS.set("ltd-done",DONE);upd();return}
if(t.dataset.g){t.parentNode.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b===t?"true":"false")});$("plugout").textContent=PLUG[t.dataset.k];return}
if(t.dataset.reset){CHK={};LS.set("ltd-chk",CHK);document.querySelectorAll("input[data-c]").forEach(function(c){c.checked=false});return}
if(t.dataset.qr){drawQ();return}
if(t.classList.contains("opt")){var i=+t.dataset.q,j=+t.dataset.o,q=QZ[i];if(i in QA)return;QA[i]=j===q[2];t.parentNode.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(k===q[2]){b.classList.add("ok");b.textContent="✓ "+b.textContent}else if(k===j){b.classList.add("bad");b.textContent="✗ "+b.textContent}});$("fb"+i).textContent=(QA[i]?"Correcto. ":"Incorrecto. ")+q[3];score()}});
document.addEventListener("change",function(e){var c=e.target;if(c.dataset.c!==undefined){CHK[c.dataset.c]=c.checked;LS.set("ltd-chk",CHK)}if(c.id==="tq"){var r=TQ[c.value];$("tqo").textContent=r?f(r[0])+" – "+f(r[1])+" N·m  ≈  "+f(r[0]/9.80665)+" – "+f(r[1]/9.80665)+" kgf·m  ≈  "+f(r[0]*0.737562)+" – "+f(r[1]*0.737562)+" lbf·ft":""}});
drawQ();upd();ath();
calc();show(location.hash.slice(1));
